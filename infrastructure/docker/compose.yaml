services:
  postgres:
    image: postgres:17
    container_name: iris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: iris-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"